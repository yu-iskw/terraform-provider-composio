name: Scheduled Go Dependency Upgrade

on:
  workflow_dispatch: {}
  schedule:
    # Runs on the 1st day of every month at 00:00 UTC
    - cron: 0 0 1 * *

jobs:
  upgrade:
    name: Upgrade Go Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v5.0.1
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Upgrade Go dependencies
        run: |
          make upgrade-go-mod
      - name: Verify build
        run: |
          go build ./...
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@67ccf781d68cd99b580ae25a5c18a1cc8431836d # v7.0.6
        with:
          commit-message: "chore(deps): upgrade go dependencies"
          title: "chore(deps): scheduled go dependency upgrade"
          body: |
            Scheduled monthly upgrade of Go dependencies.
            This PR was automatically created by the `go_dependency_upgrade.yml` workflow.
            The following commands were run:
            ```bash
            make upgrade-go-mod
            ```
          branch: chore/go-dependency-upgrade
          base: main
          delete-branch: true
          labels: |
            dependencies
            golang
