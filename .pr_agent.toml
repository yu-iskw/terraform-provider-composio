# https://qodo-merge-docs.qodo.ai/

[config]
ignore_pr_labels = ['renovate', 'skip-ai-review']
model = "vertex_ai/gemini-3-flash-preview"
fallback_models = ["vertex_ai/gemini-2.5-flash"]

[ignore]
glob = ['*.json', '*.md']

[pr_description]
generate_ai_title = true
final_update_message = true
extra_instructions = """\
This repository is a Go Terraform provider template.

When generating the title and description:
- Lead with user-visible provider behavior.
- Mention whether changes affect provider schema, resources, data sources, docs, examples, or tooling.
- State which verification commands were run.
"""

[pr_reviewer]
require_tests_review = true
require_can_be_split_review = true
num_code_suggestions = 0
inline_code_comments = true
enable_auto_approval = false
maximal_review_effort = 5
extra_instructions = """\
Review this as a Terraform Plugin Framework provider template.

Prioritize:
1. Correct Terraform schema behavior.
2. Clear, adaptable provider patterns.
3. Secret handling and diagnostics.
4. Deterministic tests using real in-process code.
"""

[pr_questions]
enable_help_text = true

[pr_code_suggestions]
num_code_suggestions = 0
rank_suggestions = false
commitable_code_suggestions = false
demand_code_suggestions_self_review = false
